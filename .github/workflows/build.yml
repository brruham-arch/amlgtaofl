name: Build NPCFight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get AML Headers
        uses: actions/checkout@v4
        with:
          repository: AndroidModLoader/AML
          path: aml_sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy AML Headers
        run: |
          mkdir -p include/mod
          cp aml_sdk/mod/amlmod.h include/mod/
          cp aml_sdk/mod/iaml.h   include/mod/
          cp aml_sdk/mod/interface.h include/mod/

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build
        run: |
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk

      - name: Verify
        run: |
          ls -lh libs/armeabi-v7a/
          file libs/armeabi-v7a/libnpcfight.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libnpcfight-arm32
          path: libs/armeabi-v7a/libnpcfight.so
          retention-days: 7
